[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudtalk-mcp"
version = "0.2.0"
description = "MCP server for CloudTalk: calls, agents, contacts and numbers."
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.17,<0.18",
]

[project.scripts]
cloudtalk-mcp = "cloudtalk_mcp.server:main"
cloudtalk-mcp-setup = "cloudtalk_mcp.cli:setup_main"
cloudtalk-mcp-verify = "cloudtalk_mcp.cli:verify_main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/cloudtalk-mcp"
Repository = "https://github.com/RosenAdvertising/cloudtalk-mcp"
Issues = "https://github.com/RosenAdvertising/cloudtalk-mcp/issues"

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
