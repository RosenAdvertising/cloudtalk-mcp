[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudtalk-mcp"
version = "0.1.0"
description = "MCP server for CloudTalk — call center management, agents, contacts, analytics for law firms"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp==2.0.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.16,<0.17",
]

[project.scripts]
cloudtalk-mcp = "cloudtalk_mcp.server:main"
cloudtalk-mcp-setup = "cloudtalk_mcp.setup.setup:main"
cloudtalk-mcp-verify = "cloudtalk_mcp.setup.verify:main"

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
